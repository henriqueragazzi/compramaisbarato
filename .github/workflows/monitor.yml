name: Monitor de IA
on:
  schedule:
    - cron: "53 12 * * 1"   # segunda 09:53 (Brasília)
  workflow_dispatch:
    inputs:
      max: { description: "Quantas perguntas", default: "40" }
permissions: { contents: write }
concurrency: { group: robo-dados, cancel-in-progress: false }
jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python agents/monitor_ia.py --max ${{ github.event.inputs.max || '40' }}
      - run: cat data/monitor/*.md | tail -60 >> $GITHUB_STEP_SUMMARY || true
      - run: |
          git config user.name "robo" && git config user.email "robo@users.noreply.github.com"
          git add data/monitor && git commit -m "monitor de IA $(date -u +%F)" || echo "sem mudanças"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((i*7)); done
