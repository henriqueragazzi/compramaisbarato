name: Bot de alertas (Telegram)

on:
  schedule:
    - cron: "*/10 * * * *"   # responde as mensagens do bot a cada ~10 min
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - id: check
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then echo "ok=true" >> $GITHUB_OUTPUT; else echo "::notice::Sem TELEGRAM_BOT_TOKEN ainda: bot em espera."; fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.check.outputs.ok == 'true'
        with: { python-version: "3.12", cache: pip }
      - if: steps.check.outputs.ok == 'true'
        run: pip install -q -r requirements.txt
      - name: Responder mensagens
        if: steps.check.outputs.ok == 'true'
        run: python agents/bot.py
      - name: Salvar
        if: steps.check.outputs.ok == 'true'
        run: |
          git config user.name "robo" && git config user.email "robo@users.noreply.github.com"
          git add data/alertas.enc 2>/dev/null && git commit -qm "bot $(date -u +%F-%H%M)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((i*5)); done
