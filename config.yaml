# ============================================================
#  CONFIGURAÇÃO DO SITE — edite só este arquivo para personalizar
# ============================================================
site:
  nome: "Compra Mais Barato"
  url: "https://www.compramaisbarato.com.br"   # sem barra no fim
  slogan: "Diga o que você precisa e a gente acha o melhor preço"
  descricao: "Guias de compra e ofertas da Shopee para casa, pet, carro e presentes, com preço atualizado várias vezes ao dia."
  telegram: "https://t.me/comprarmaisbarato"   # link do CANAL de ofertas
  telegram_bot: "CompraMaisBaratoBot"      # usuário do BOT de alertas, sem @, ex: CompraMaisBaratoBot
  whatsapp: ""          # link do canal (opcional)
  indexnow: "6f6a5c839387da3290c5b73aa7e762bd"   # chave pública do IndexNow (fica visível no site, não é senha)

# Filtros de qualidade do Caçador (produto ruim não entra no site)
filtros:
  nota_minima: 4.6
  vendas_minimas: 100
  comissao_minima: 0.03     # 3%
  max_produtos_por_nicho: 400
  por_nicho:            # regras próprias de um nicho (sobrepõem as de cima)
    pet: { vendas_minimas: 50, nota_minima: 4.5 }
    moveis: { vendas_minimas: 20, nota_minima: 4.5 }   # itens caros vendem menos unidades, mas pagam mais comissão
    natal: { vendas_minimas: 50, nota_minima: 4.5 }

