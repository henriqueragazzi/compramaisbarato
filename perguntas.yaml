# Perguntas que viram guias. Cada uma é uma pergunta REAL que as pessoas fazem ao ChatGPT.
# O Redator escreve um guia para cada pergunta usando só produtos do catálogo.
# "busca" = termos para achar produtos no catálogo; "ate" = preço máximo (opcional).
# O Monitor de IA usa esta mesma lista para medir se o site é citado.

